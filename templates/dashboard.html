<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screener</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        .upload-box {
            border: 2px dashed #3498db;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #2980b9;
        }

        .note {
            margin-top: 15px;
            font-size: 13px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="header">
    AI Resume Screening System
</div>

<div class="container">

    <div class="upload-box">

        <h2>Upload Your Resume</h2>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <input type="file" name="resume" required><br>

            <button type="submit">Analyze Resume</button>

        </form>

        <div class="note">
            Supports PDF & DOCX files
        </div>

    </div>

</div>

</body>
</html>
